# Inside the web container: the static marketing site. The front nginx (conf.d/default.conf) proxies directmate.app/
# here. Astro builds each page as a file (build.format 'file'): /pricing is pricing.html, / is index.html.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Redirects stay relative: this container only sees http://web, never the public host.
    absolute_redirect off;

    # One URL per page: no trailing slash, no .html.
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }
    location ~ ^(.+)\.html$ {
        return 301 $1$is_args$args;
    }

    location / {
        try_files $uri $uri.html =404;
    }

    location = / {
        try_files /index.html =404;
    }
    location = /index.html {
        return 301 /;
    }
    location = /index {
        return 301 /;
    }

    # The admin's old landing.
    location = /welcome {
        return 301 /;
    }

    # Content-hashed assets (scripts, styles, optimized images) never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
