# platform.directmate.app — the admin panel (store owners, managers, superadmins).
# directmate.app is the marketing site (default.conf) and keeps the routes Meta,
# n8n and Telegram call.
#
# The admin calls the API on its own host (/api, apps/admin/src/lib/api.ts) and
# shows /uploads images, so both are proxied here. Nothing else of the API is.
# The API builds its links to the admin from ADMIN_BASE_URL
# (docker-compose.prod.yml): OAuth return pages, Telegram notices, payment
# returns, Claude sign-in, connect links.
#
# First deploy, in this order (nginx refuses to start while a certificate
# named below is missing, and that takes every site on this server down):
#   1. DNS: an A record for platform.directmate.app pointing at this server.
#   2. The certificate, before this file is live:
#        docker compose -f docker-compose.prod.yml run --rm --entrypoint certbot certbot \
#          certonly --webroot --webroot-path=/var/www/certbot -d platform.directmate.app
#      The certbot service renews it with the others.
#   3. Deploy. Check: curl -I https://platform.directmate.app/login answers 200,
#      curl -I https://directmate.app/login answers 301 to it.

# HTTP — ACME challenge + redirect to HTTPS
server {
    listen 80;
    server_name platform.directmate.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — the admin
server {
    listen 443 ssl http2;
    server_name platform.directmate.app;

    ssl_certificate     /etc/letsencrypt/live/platform.directmate.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.directmate.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ─── Admin Panel (static files) ──────────────────────
    location / {
        proxy_pass http://admin:80;
        proxy_set_header Host $host;
    }

    # ─── Testing endpoints (long-running simulator runs) ──
    # Must come before `location /api/`; see default.conf for why the timeout.
    location /api/testing/ {
        proxy_pass http://api:3000/testing/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # ─── API ─────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Uploaded files (product images, size charts, customer photos) ───
    location /uploads/ {
        proxy_pass http://api:3000/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
