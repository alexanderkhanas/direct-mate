# MCP vhost — the Claude connector. Owners paste https://mcp.directmate.app/mcp
# into Claude; Claude signs in through the OAuth routes below and then calls
# the MCP endpoint. All of it is served by the api container (McpHttpService,
# mounted only when MCP_ENABLED=true).
#
# Hardening:
#   - Only the connector's own routes are proxied: /mcp, the two OAuth
#     metadata documents, /oauth/register|authorize|token. Everything else on
#     this host returns 404, so /internal, /testing, /docs, /auth and the rest
#     of the API are not reachable through it.
#   - Per-IP limits only on client registration and sign-in starts. /mcp and
#     /oauth/token are not limited per IP: every claude.ai user arrives from
#     Anthropic's addresses. The API limits /mcp per grant instead.
#
# First deploy, in this order (nginx refuses to start while a certificate
# named below is missing, and that takes every site on this server down):
#   1. DNS: an A record for mcp.directmate.app pointing at this server.
#   2. The certificate. Every port-80 server here already answers ACME
#      challenges from the shared webroot, so before this file is live:
#        docker compose -f docker-compose.prod.yml run --rm --entrypoint certbot certbot \
#          certonly --webroot --webroot-path=/var/www/certbot -d mcp.directmate.app
#      The certbot service renews it with the others.
#   3. Deploy this file, set MCP_ENABLED / MCP_PUBLIC_URL / MCP_COOKIE_DOMAIN in .env,
#      restart api, then: docker compose -f docker-compose.prod.yml exec nginx nginx -s reload
#   4. Check: curl https://mcp.directmate.app/.well-known/oauth-protected-resource/mcp
#      answers JSON; curl -i https://mcp.directmate.app/docs answers 404.

# HTTP — ACME challenge + redirect to HTTPS
server {
    listen 80;
    server_name mcp.directmate.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — the connector
server {
    listen 443 ssl http2;
    server_name mcp.directmate.app;

    ssl_certificate     /etc/letsencrypt/live/mcp.directmate.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.directmate.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/mcp.directmate.app.access.log;
    error_log  /var/log/nginx/mcp.directmate.app.error.log warn;

    # Shared by every proxied route. X-Real-IP is overwritten with the address
    # nginx saw, so the API can trust it; X-Forwarded-Proto keeps the issuer https.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # The MCP endpoint. A tool call can take a while: connect_catalog waits up
    # to ~30 s for an import, try_agent runs a full agent turn (up to 45 s).
    location = /mcp {
        proxy_pass http://api:3000;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # OAuth metadata (RFC 9728 and RFC 8414), with or without the /mcp suffix.
    location ~ ^/\.well-known/oauth-(protected-resource|authorization-server)(/mcp)?$ {
        proxy_pass http://api:3000;
    }

    # Dynamic client registration and the start of a sign-in (a browser
    # redirect to the admin's consent page): limited per IP.
    location ~ ^/oauth/(register|authorize)$ {
        limit_req zone=oauth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:3000;
    }

    # Code and refresh-token exchange, called from Claude's servers.
    location = /oauth/token {
        proxy_pass http://api:3000;
    }

    location / {
        return 404;
    }
}
