# GTA Sunrise project form — gtasunrise.directmate.app
#
# The client of the gtasunrise.com redesign fills in city, price and timeline
# for each project and uploads photos. The app is its own compose project in
# /opt/gtasunrise-form (container gtasunrise-form on production_internal),
# outside the deploy tree, like mono-jars. Updating it is an rsync and
# `docker compose up -d --build` there, not a DirectMate deploy.
#
#   /design/  the redesign presentation for the client: every screen of the
#             new site, desktop and phone (static, ~30 MB with images)
#
# The presentation lives in /srv/gtasunrise-docs on the host, outside the
# deploy tree, like /srv/vinlinkauto: updating it is an rsync, not a deploy.
#
#   rsync -az --delete site/ root@<box>:/srv/gtasunrise-docs/

# HTTP — ACME challenge + redirect to HTTPS
server {
    listen 80;
    server_name gtasunrise.directmate.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — proxied to the app
server {
    listen 443 ssl http2;  # same form as the other sites: mixing the two on :443 makes nginx warn
    server_name gtasunrise.directmate.app;

    ssl_certificate     /etc/letsencrypt/live/gtasunrise.directmate.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gtasunrise.directmate.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    server_tokens off;

    access_log /var/log/nginx/gtasunrise.directmate.app.access.log;
    error_log  /var/log/nginx/gtasunrise.directmate.app.error.log warn;

    # A phone photo is accepted up to 35 MB and arrives with its preview and
    # thumbnail in the same request.
    client_max_body_size 40m;
    client_body_timeout 120s;

    location = /design {
        return 301 /design/;
    }

    location /design/ {
        root /srv/gtasunrise-docs;
        index index.html;
        charset utf-8;
        autoindex off;

        # add_header here drops the http{} block's inherited headers, so the
        # security ones are restated, as in vinlinkauto.conf.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Re-uploaded in place under the same URL while the design changes,
        # so the browser must revalidate rather than show a stale screen.
        add_header Cache-Control "no-cache" always;

        location ~ /\. {
            return 404;
        }

        try_files $uri $uri/ =404;
    }

    location / {
        # Looked up per request through Docker's DNS, so nginx still starts
        # (and the other sites stay up) when this container is not running.
        resolver 127.0.0.11 valid=30s;
        set $gtasunrise_form http://gtasunrise-form:8080;
        proxy_pass $gtasunrise_form;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
