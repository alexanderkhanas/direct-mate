# VinLinkAuto project documents — vinlinkauto.directmate.app
#
# Static pages handed to a client: the spec and the design mockups.
#
#   /         cover page with links
#   /tz/      technical specification
#   /makety/  28 site + admin screens (one ~2 MB self-contained HTML)
#
# Content lives in /srv/vinlinkauto on the host, OUTSIDE the deploy tree
# (/opt/directmate), same as the FTP images behind cdn.directmate.app. That is
# deliberate: updating a document is an rsync, not a deploy, so a typo fix in
# the spec never rebuilds the app.
#
#   rsync -az --delete site/ root@<box>:/srv/vinlinkauto/
#
# Not indexed (X-Robots-Tag + robots.txt): the spec carries prices and a
# payment schedule. The URL is unguessable enough for sharing with one client;
# it is not a secret, so nothing sensitive beyond that belongs here.

# HTTP — ACME challenge + redirect to HTTPS
server {
    listen 80;
    server_name vinlinkauto.directmate.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — static documents
server {
    listen 443 ssl http2;
    server_name vinlinkauto.directmate.app;

    ssl_certificate     /etc/letsencrypt/live/vinlinkauto.directmate.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vinlinkauto.directmate.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /srv/vinlinkauto;
    index index.html;

    # The documents are Ukrainian; without this nginx sends bare `text/html`
    # and the browser is free to guess an 8-bit codepage.
    charset utf-8;

    autoindex off;
    server_tokens off;

    access_log /var/log/nginx/vinlinkauto.directmate.app.access.log;
    error_log  /var/log/nginx/vinlinkauto.directmate.app.error.log warn;

    # add_header at this level drops the http{} block's inherited headers,
    # so the security ones are restated here.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Documents are re-uploaded in place under the same URL, so the browser
    # must revalidate rather than serve a stale copy of a rewritten spec.
    add_header Cache-Control "no-cache" always;

    # Block dotfiles anywhere in the path.
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
