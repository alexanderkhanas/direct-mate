# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name ${DOMAIN};

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name ${DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ─── Marketing site (apps/web, static) ───────────────
    # The admin is on platform.directmate.app (conf.d/platform.conf). This host
    # keeps the API routes below: Meta's OAuth callback and webhook, n8n, the
    # demo widget's /api/demo, uploads.
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
    }

    # ─── The admin's old addresses ───────────────────────
    # Bookmarks, links in Telegram notices, payment returns and connect links
    # land on the same page on platform.directmate.app, query string kept (a
    # #fragment travels with the redirect on its own). Keep this list in step
    # with the admin's routes (apps/admin/src/App.tsx).
    location ~ ^/(login|register|claude|connect|onboarding|conversations|orders|catalog|connections|content-linking|size-charts|settings|logs|training|simulator|admin)(/|$) {
        return 301 https://platform.directmate.app$request_uri;
    }

    # ─── Testing endpoints (long-running simulator runs) ──
    # /api/testing/simulator/run-all fans out across every
    # scenario sequentially; with ~20+ luxespace scenarios and
    # multiple OpenAI classifier calls per turn this can run
    # for several minutes. Default proxy_read_timeout (60s) is
    # too short → 504 from nginx mid-run. Admin-JWT-guarded
    # endpoint, not customer-facing, so a generous timeout is
    # safe. Note: this block must come BEFORE `location /api/`
    # so nginx's longest-prefix match selects it.
    location /api/testing/ {
        proxy_pass http://api:3000/testing/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # ─── API ─────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Swagger docs ───────────────────────────────────
    location /docs {
        proxy_pass http://api:3000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── Instagram webhooks (no /api prefix) ─────────────
    location /channels/ {
        limit_req zone=webhooks burst=10 nodelay;
        proxy_pass http://api:3000/channels/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── OAuth callbacks ─────────────────────────────────
    location /auth/ {
        proxy_pass http://api:3000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Internal API (n8n callbacks) ────────────────────
    location /internal/ {
        # Only allow from internal network
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://api:3000/internal/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ─── Legal pages, old addresses ──────────────────────
    # /privacy, /terms and /data-deletion are the site's pages now. The api
    # still serves its copies at /static/*.html (useStaticAssets in
    # apps/api/src/main.ts), so a URL registered with Meta under /static keeps
    # answering.
    location /static/ {
        proxy_pass http://api:3000/static/;
        proxy_set_header Host $host;
    }

    # ─── Uploaded files (product images, size charts) ───
    # Served by the API via `app.useStaticAssets('/uploads', ...)`. Cached
    # aggressively because file paths are content-stable (seed-managed).
    location /uploads/ {
        proxy_pass http://api:3000/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ─── n8n ─────────────────────────────────────────────
    location /n8n/ {
        proxy_pass http://n8n:5678/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
